# Nav2 Costmap Common Parameters (ROS 2 Humble)
# Translated from ROS 1 stretch_navigation costmap_common_params.yaml

footprint: [[-0.175, -0.175], [-0.175, 0.175], [0.175, 0.175], [0.175, -0.175]]
robot_radius: 0.25

obstacle_layer:
  ros__parameters:
    enabled: true
    observation_sources: laser
    laser:
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      obstacle_range: 2.5
      raytrace_range: 3.0
      inf_is_valid: true

inflation_layer:
  ros__parameters:
    enabled: true
    inflation_radius: 0.55
    cost_scaling_factor: 10.0

static_layer:
  ros__parameters:
    enabled: true
    map_subscribe_transient_local: true